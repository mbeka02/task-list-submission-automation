name: Deploy preview

on:
  workflow_dispatch:
    inputs:
      digest:
        description: SHA-256 digest from the successful Publish image run (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: task-list-preview-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Validate the approved image and target
        env:
          DIGEST: ${{ inputs.digest }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 2
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]] || exit 2
          printf 'DEPLOY_IMAGE=ghcr.io/mbeka02/task-list-submission-automation@%s\n' "$DIGEST" >> "$GITHUB_ENV"

      - name: Join the restricted deployment tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:task-list-ci

      - name: Deploy the digest through the restricted SSH command
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          key="$RUNNER_TEMP/task-list-deploy-key"
          hosts="$RUNNER_TEMP/task-list-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "task-list-deploy@$DEPLOY_HOST" "deploy --image $DEPLOY_IMAGE"
          printf 'Preview deployment requested by %s: `%s`\n' "$GITHUB_ACTOR" "$DEPLOY_IMAGE" >> "$GITHUB_STEP_SUMMARY"
