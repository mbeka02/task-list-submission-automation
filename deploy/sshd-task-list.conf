# Install under /etc/ssh/sshd_config.d after provisioning the restricted account/key.
Match User task-list-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/task-list-deploy.authorized_keys
    PermitTTY no
    DisableForwarding yes
    PermitUserRC no
    ForceCommand /usr/local/sbin/task-list-deploy-ssh
Match all
